  }

  .tab{padding:8px 12px;border-radius:999px;background:#1b1b24;border:1px solid #2a2a34;color:var(--muted);white-space:nowrap;cursor:pointer}
  .tab.active{background:var(--accent);color:#1a1200;border-color:#0000;font-weight:700}

<script>
// --- Utilidades IndexedDB muy simples ---
const DB_NAME = 'mariachi-soundboard-v1';
const STORE = 'sounds';
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME,1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(STORE)){
        const os = db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});
        os.createIndex('category','category');
      }
    };
    req.onsuccess = ()=>{db=req.result; resolve(db)};
    req.onerror = ()=>reject(req.error);
  });
}
function addSound(rec){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).add(rec).onsuccess=e=>resolve(e.target.result);
    tx.onerror=e=>reject(tx.error);
  });
}
function updateSound(rec){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(rec).onsuccess=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
function deleteSound(id){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id).onsuccess=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
function getAll(){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readonly');
    const req=tx.objectStore(STORE).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  });
}

function fmtCat(c){return (c&&c.trim())?c.trim():"Sin categoría"}

function renderTabs(){
  const cats = Array.from(new Set(['Todas',...SOUNDS.map(s=>fmtCat(s.category))]));
  tabs.innerHTML='';
  cats.forEach(cat=>{
    const el=document.createElement('button');
    el.className='tab'+(cat===currentTab?' active':'');
    el.textContent=cat; el.onclick=()=>{currentTab=cat; renderGrid(); renderTabs()};
    tabs.appendChild(el);
  });
}

function renderGrid(){
  grid.innerHTML='';
  const items = SOUNDS.filter(s=> currentTab==='Todas' || fmtCat(s.category)===currentTab );
  if(!items.length){
    const p=document.createElement('p');
    p.className='help';
    p.textContent='No hay sonidos en esta pestaña. Agrega con el botón de arriba.';
    grid.appendChild(p);return;
  }
  items.forEach(s=>{
    const pad=document.createElement('button');
    pad.className='pad';
    pad.style.backgroundColor = '#1b1b24';
    const tint=document.createElement('div');tint.className='bg';tint.style.background=s.color||'#ffd54a';pad.appendChild(tint);
    const label=document.createElement('div');label.className='label';label.textContent=s.label||'Sin nombre';pad.appendChild(label);
    const hint=document.createElement('small');hint.textContent=fmtCat(s.category);pad.appendChild(hint);

    attachPadHandlers(pad, s);
    grid.appendChild(pad);
  });
}

function stopAll(){
  for(const [id,node] of playingNodes){
    try{node.pause(); node.currentTime=0;}catch{}
  }
  playingNodes.clear();
  document.querySelectorAll('.pad.playing').forEach(el=>el.classList.remove('playing'));
}

function playSound(s, padEl){
  if (cutMode && cutMode.checked) stopAll();
  const url = URL.createObjectURL(s.blob);
  const audio = new Audio(url);
  audio.volume = Number(volume.value||1);
  audio.onended = ()=>{
    padEl?.classList.remove('playing');
    playingNodes.delete(s.id);
    URL.revokeObjectURL(url);
  };
  audio.play();
  padEl?.classList.add('playing');
  playingNodes.set(s.id,audio);
};
  audio.play();
  padEl?.classList.add('playing');
  playingNodes.set(s.id,audio);
}

async function openEditor(s){
  const newLabel = prompt('Editar etiqueta', s.label||'');
  if(newLabel===null) return; // cancel
  const newCat = prompt('Editar categoría', s.category||'');
  const newColor = prompt('Editar color (hex, ej. #ffcc33)', s.color||'#ffcc33');
  s.label=newLabel; s.category=newCat; s.color=newColor;
  await updateSound(s); await refresh();
}

// --- Utilidades WAV de silencio ---
function makeSilentWav(durationSec=0.5, sampleRate=44100){
  const numSamples = Math.floor(durationSec*sampleRate);
  const bytesPerSample = 2; // PCM16
  const numChannels = 1;
  const blockAlign = numChannels*bytesPerSample;
  const byteRate = sampleRate*blockAlign;
  const dataSize = numSamples*blockAlign;
  const buffer = new ArrayBuffer(44+dataSize);
  const view = new DataView(buffer);
  let o=0;
  function writeStr(s){ for(let i=0;i<s.length;i++) view.setUint8(o++, s.charCodeAt(i)); }
  function write32(v){ view.setUint32(o, v, true); o+=4; }
  function write16(v){ view.setUint16(o, v, true); o+=2; }
  // RIFF header
  writeStr('RIFF'); write32(36+dataSize); writeStr('WAVE');
  // fmt chunk
  writeStr('fmt '); write32(16); write16(1); write16(numChannels); write32(sampleRate); write32(byteRate); write16(blockAlign); write16(bytesPerSample*8);
  // data chunk
  writeStr('data'); write32(dataSize);
  // samples (silence = 0)
  for(let i=0;i<numSamples;i++){ view.setInt16(o, 0, true); o+=2; }
  return new Blob([buffer], {type:'audio/wav'});
}

// Gestos en botones (evitar popups accidentales)
function attachPadHandlers(pad, s){
  let pressTimer=null; let startX=0,startY=0; let moved=false;
  pad._lastTap=0;
  pad.addEventListener('pointerdown',(e)=>{
    moved=false; startX=e.clientX; startY=e.clientY;
    // Reproduce en el down para minimizar latencia
    playSound(s,pad);
    if(editMode==='long'){
      pressTimer = setTimeout(()=>{ if(!moved) openEditor(s); }, longPressMs);
    }
  });
  pad.addEventListener('pointermove',(e)=>{
    if(Math.hypot(e.clientX-startX, e.clientY-startY) > 12){ moved=true; if(pressTimer){clearTimeout(pressTimer);} }
  });
  pad.addEventListener('pointerup',()=>{
    if(pressTimer){ clearTimeout(pressTimer); }
    if(editMode==='double'){
      const now=Date.now();
      if(now - (pad._lastTap||0) < 300){ openEditor(s); pad._lastTap=0; return; }
      pad._lastTap = now;
    }
  });
  pad.addEventListener('pointercancel',()=>{ if(pressTimer){clearTimeout(pressTimer);} });
  pad.addEventListener('contextmenu',(e)=> e.preventDefault());
}

    category: document.getElementById('categoryInput').value||'Gritos',

    blob: new Blob([await f.arrayBuffer()], {type:f.type||'audio/mpeg'}),
    createdAt: Date.now()
  };
  await addSound(rec);
  document.getElementById('fileInput').value='';
  await refresh();
};

// Exportar / Importar respaldo (JSON, con blobs base64)
function blobToBase64(blob){
  return new Promise((resolve)=>{
    const r=new FileReader(); r.onload=()=>resolve(r.result); r.readAsDataURL(blob);
  });
}

async function exportBackup(){
  const data = await getAll();
  const items=[];
  for(const s of data){
    items.push({id:s.id,label:s.label,category:s.category,color:s.color,createdAt:s.createdAt, data: await blobToBase64(s.blob)});
  }
  const json = JSON.stringify({version:1, items});
  const blob = new Blob([json], {type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='mariachi-soundboard-backup.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

document.getElementById('importBackupBtn').onclick=()=>document.getElementById('backupFile').click();

document.getElementById('backupFile').onchange=async (e)=>{
  const f=e.target.files?.[0]; if(!f) return;
  const txt=await f.text();
  try{ const obj=JSON.parse(txt); if(!obj.items) throw new Error('archivo inválido');
    for(const it of obj.items){
      const res = await fetch(it.data); const blob = await res.blob();
      await addSound({label:it.label,category:it.category,color:it.color,blob,createdAt:it.createdAt||Date.now()});
    }
    await refresh(); alert('Respaldo importado');
  }catch(err){ alert('No se pudo importar el respaldo'); }
  e.target.value='';
};

async function resetApp(){
  try{
    // 1) Cerrar y borrar IndexedDB
    if(db){ db.close && db.close(); }
    await new Promise((res,rej)=>{
      const del = indexedDB.deleteDatabase('mariachi-soundboard-v1');
      del.onsuccess=()=>res(); del.onerror=()=>res(); del.onblocked=()=>res();
    });
    // 2) Limpiar caches (Service Worker)
    if('caches' in self){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    // 3) Desregistrar SW
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    alert('App reseteada. Se recargará.');
    location.reload();
  }catch(err){
    console.error('[resetApp] error', err);
    alert('No se pudo resetear completamente. Intenta cerrar todas las pestañas y abrir de nuevo.');
  }
}

<div id="debugPanel" style="position:fixed;left:8px;right:8px;bottom:calc(var(--footerh) + 8px);background:#111a;border:1px solid #fff2;border-radius:10px;padding:8px;font:12px monospace;color:#fff;display:none;max-height:35vh;overflow:auto;z-index:9999"></div>
<script>
  // Mini consola en pantalla para móviles
  const dbg = document.getElementById('debugPanel');
  function showDbg(msg){ try{ dbg.style.display='block'; const time=new Date().toLocaleTimeString(); dbg.innerHTML += `<div>[${time}] ${msg}</div>`; dbg.scrollTop = dbg.scrollHeight; }catch(e){} }
  window.addEventListener('error', (e)=>{ showDbg('ERROR: '+ (e.message||'') + ' @'+ (e.filename||'') + ':' + (e.lineno||'')); });
  window.addEventListener('unhandledrejection', (e)=>{ showDbg('PROMISE REJECTION: '+ (e.reason && e.reason.message ? e.reason.message : e.reason)); });
  console.log = ((orig)=> function(){ orig.apply(console, arguments); try{ showDbg('[log] '+ Array.from(arguments).join(' ')); }catch(e){} })(console.log);
  console.error = ((orig)=> function(){ orig.apply(console, arguments); try{ showDbg('[error] '+ Array.from(arguments).join(' ')); }catch(e){} })(console.error);
</script>
