<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mariachi Soundboard – Modo Diagnóstico</title>
<style>
  :root{--bg:#0b0b0f;--card:#14141a;--text:#f5f5f7;}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Inter,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid #ffffff22;border-radius:14px;padding:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{background:#ffd54a;color:#1a1200;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
  input,select{background:#1b1b24;border:1px solid #2a2a34;color:#fff;padding:10px 12px;border-radius:10px}
  .tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}
  .tab{padding:8px 12px;border-radius:999px;background:#1b1b24;border:1px solid #2a2a34;color:#9aa0a6;white-space:nowrap;cursor:pointer}
  .tab.active{background:#ffd54a;color:#1a1200;border-color:#0000;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}
  .pad{position:relative;background:#1b1b24;border:1px solid #2a2a34;border-radius:16px;min-height:86px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
  .pad .label{color:#fff;font-weight:800;text-transform:uppercase}
  .footer{position:sticky;bottom:0;z-index:2;margin-top:12px}
  #dbg{font:12px/1.4 monospace;background:#111a;border:1px solid #fff2;border-radius:10px;padding:8px;max-height:30vh;overflow:auto;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mariachi Soundboard — Diagnóstico</h1>
  <p>Si ves esto, el HTML carga bien. Probemos funciones sin Service Worker.</p>

  <div class="card">
    <div class="row">
      <input id="label" placeholder="Etiqueta (¡Ajúa!)">
      <input id="cat" placeholder="Categoría (Gritos)">
      <input id="color" type="color" value="#ffcc33">
    </div>
    <div class="row" style="margin-top:8px">
      <input id="file" type="file" accept="audio/*">
      <button id="add" class="btn">➕ Agregar sonido</button>
      <button id="seed" class="btn">📦 Paquete 50</button>
      <button id="reset" class="btn" style="background:#ff6b6b;color:#1a0000">🧹 Reset</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>

  <div class="footer">
    <div id="dbg"></div>
  </div>
</div>

<script>
const DB='mariachi-soundboard-v1', STORE='sounds'; let db, SOUNDS=[], tab='Todas';
const log=(...a)=>{console.log('[DBG]',...a);showDbg(a.join(' '))}; const showDbg=(m)=>{const d=document.getElementById('dbg');d.style.display='block';d.innerHTML+=`<div>${m}</div>`;d.scrollTop=d.scrollHeight};
window.addEventListener('error',e=>showDbg('ERROR: '+e.message));
window.addEventListener('unhandledrejection',e=>showDbg('REJECT: '+(e.reason?.message||e.reason)));

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE)){const os=db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});os.createIndex('category','category');}};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function addSound(rec){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).add(rec).onsuccess=e=>res(e.target.result);tx.onerror=()=>rej(tx.error)})}
function updateSound(rec){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(rec).onsuccess=()=>res();tx.onerror=()=>rej(tx.error)})}
function getAll(){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const rq=tx.objectStore(STORE).getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error)})}

function renderTabs(){const cats=['Todas',...new Set(SOUNDS.map(s=>(s.category||'').trim()||'Sin categoría'))];const el=document.getElementById('tabs');el.innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.className='tab'+(c===tab?' active':'');b.textContent=c;b.onclick=()=>{tab=c;renderGrid()};el.appendChild(b)})}
function renderGrid(){const g=document.getElementById('grid');g.innerHTML='';const list=SOUNDS.filter(s=>tab==='Todas'||(s.category||'').trim()===tab||((s.category||'').trim()===''&&tab==='Sin categoría'));if(!list.length){const p=document.createElement('p');p.textContent='(sin sonidos)';g.appendChild(p);return}list.forEach(s=>{const pad=document.createElement('button');pad.className='pad';const lab=document.createElement('div');lab.className='label';lab.textContent=s.label||'Sin nombre';pad.appendChild(lab);pad.style.borderColor='#2a2a34';pad.style.background='#1b1b24';pad.onclick=()=>play(s,pad);pad.ondblclick=()=>edit(s);g.appendChild(pad)})}

function play(s,el){const url=URL.createObjectURL(s.blob);const a=new Audio(url);a.setAttribute('playsinline','true');a.volume=1;a.onended=()=>URL.revokeObjectURL(url);a.play().catch(()=>{});el.classList.add('playing');setTimeout(()=>el.classList.remove('playing'),300)}
async function edit(s){const nl=prompt('Etiqueta',s.label||''); if(nl===null) return; const nc=prompt('Categoría',s.category||''); s.label=nl; s.category=nc; await updateSound(s); await refresh()}

async function refresh(){SOUNDS=await getAll();renderTabs();renderGrid();log('items:',SOUNDS.length)}

document.getElementById('add').onclick=async ()=>{
  try{
    const f=document.getElementById('file').files?.[0]; if(!f){alert('Elige un audio');return}
    const rec={label:document.getElementById('label').value||f.name.replace(/\.[^.]+$/,''),category:document.getElementById('cat').value||'Gritos',color:document.getElementById('color').value||'#ffcc33',blob:new Blob([await f.arrayBuffer()],{type:f.type||'audio/mpeg'}),createdAt:Date.now()};
    await addSound(rec); document.getElementById('file').value=''; await refresh();
  }catch(e){showDbg('ADD ERR: '+e.message)}
};

document.getElementById('seed').onclick=async ()=>{
  try{
    const exist=await getAll(); if(exist.length && !confirm('Ya tienes sonidos. ¿Agregar los 50 demo?')) return;
    const blob=silent(0.25);
    const addMany=async(arr,cat)=>{for(const t of arr){await addSound({label:t,category:cat,color:'#ffd54a',blob,createdAt:Date.now()})}};
    await addMany(['¡Sorpresa!','¡Que viva la cumpleañera!','¡Feliz cumpleaños!','¡Beso!','¡Otra, otra!','¡Foto!','¡Que cante!','¡Apaguen las velas!','¡Aplauso!','¡Viva!'],'Cumpleaños');
    await addMany(['¡Salud!','Arriba, abajo, al centro y pa’ dentro','¡Trago bendito!','¡Todos con sus copas!','¡A la de tres!','¡Que se escuche!','¡Salud, salud!','¡Brindis!','¡Chin chin!','¡Seco!'],'Brindis');
    await addMany(['¡Que muerda la torta!','¡Muerde, muerde!','¡Corten la torta!','¡La mordida!','¡Foto con la torta!','¡La vela!','¡Soplen!','¡Repartan!','¡Aplauso a la torta!','¡Torta, torta!'],'Torta');
    await addMany(['¡Gracias por su cariño!','¡Hasta pronto!','¡Nos vemos familia!','¡Buenas noches!','¡Se despide el mariachi!','¡Viva el amor!','¡La festejada!','¡Hermoso público!','¡Hasta la próxima!','¡Hasta luego!'],'Despedida');
    await addMany(['¡Muy buenas noches!','¡Bienvenidos!','¡Arriba las palmas!','¡Aplauso a los anfitriones!','¡Fuerte ese grito!','¡Listos para cantar!','¡Llegó el mariachi!','¡Somos Los Coyotes!','¡Ajusten las gargantas!','¡Eso mi gente!'],'Saludo');
    await refresh(); alert('Paquete cargado ✅');
  }catch(e){showDbg('SEED ERR: '+e.message)}
};

document.getElementById('reset').onclick=async ()=>{
  try{
    if(db){db.close&&db.close()}
    await new Promise((r)=>{const del=indexedDB.deleteDatabase(DB);del.onsuccess=()=>r();del.onerror=()=>r();del.onblocked=()=>r();});
    if('caches' in self){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
    if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}
    alert('Reseteado. Recarga.');
    location.reload();
  }catch(e){showDbg('RESET ERR: '+e.message)}
};

function silent(d=0.25, sr=44100){const n=Math.floor(d*sr), bps=2, ch=1, ba=ch*bps, br=sr*ba, ds=n*ba, buf=new ArrayBuffer(44+ds), v=new DataView(buf);let o=0;
  const ws=s=>{for(let i=0;i<s.length;i++) v.setUint8(o++,s.charCodeAt(i))}, w32=x=>{v.setUint32(o,x,true);o+=4}, w16=x=>{v.setUint16(o,x,true);o+=2};
  ws('RIFF');w32(36+ds);ws('WAVE');ws('fmt ');w32(16);w16(1);w16(ch);w32(sr);w32(br);w16(ba);w16(bps*8);ws('data');w32(ds);
  for(let i=0;i<n;i++){v.setInt16(o,0,true);o+=2} return new Blob([buf],{type:'audio/wav'})}
(async function init(){try{await openDB();await refresh();log('OK: init')}catch(e){showDbg('INIT ERR: '+e.message)}})();
</script>
</body>
</html>
